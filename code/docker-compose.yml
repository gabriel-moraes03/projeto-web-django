services:
  # Armazenamento das imagens (compatível com S3)
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: acervo_sonoro_seaweedfs
    ports:
      - "8333:8333"
    command: "server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  seaweedfs_data:
